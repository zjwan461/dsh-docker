# Build the dsh-docker image on GitHub Actions and publish it to GHCR.
#
#   push to main            build + push + tag + GitHub release
#   pull request            build only (no push, no registry login needed)
#   manual (workflow_dispatch)  build + optional push, optional arm64, full or slim
#
# ── Versioning contract ─────────────────────────────────────────────────────
# The dsh version in `.env.example`'s DSH_VERSION drives everything:
#
#   image tag   ghcr.io/<owner>/<repo>:<dsh version>   e.g. :0.2.2-rc.5
#   git tag     v<dsh version>                          e.g. v0.2.2-rc.5
#   release     titled "dsh <dsh version>"
#
# So a dsh release and its matching image share one number: when dsh publishes
# 0.2.2-rc.5, this repository's release is v0.2.2-rc.5 and the image is
# :0.2.2-rc.5. Nothing invents a version the repository does not pin.
#
# `latest` is NOT unconditional. It moves only when the version being built is
# the highest one this repository has ever tagged — republishing an older
# version (a hotfix rebuild, a revert) must not drag `latest` backwards.
#
# The workflow does not trigger on v* tag pushes on purpose: it CREATES the tag
# itself in the release job, so a tag trigger would launch a duplicate
# 20-minute build of the same commit every time a release is cut. To rebuild a
# specific version, use workflow_dispatch with `dsh_version`.
#
# The Dockerfile's own build-time gates (Node floor, install-tree assertion,
# settings patch --check, --dump-config, 60s boot smoke from an empty home) run
# inside the build, so a green build already means "this image boots".
name: build-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - doctor.mjs
      - patch-client-settings.mjs
      - plugins/**
      - skills/**
      - unauth/**
      - Caddyfile
      - compose.yaml
      - .env.example
      - .dockerignore
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - doctor.mjs
      - patch-client-settings.mjs
      - plugins/**
      - skills/**
      - unauth/**
      - Caddyfile
      - compose.yaml
      - .env.example
      - .dockerignore
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '@deepseek-ai/dsh version to install (empty = read .env.example)'
        required: false
        default: ''
      layers:
        description: 'Optional layers: full (office + chrome + python) or slim'
        type: choice
        options: [full, slim]
        default: full
      platforms:
        description: 'arm64 runs under QEMU and takes much longer'
        type: choice
        options: ['linux/amd64', 'linux/amd64,linux/arm64']
        default: linux/amd64
      push:
        description: 'Push the result to GHCR'
        type: boolean
        default: true

# One build per ref: a newer push supersedes an in-flight one.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Cheap, deterministic checks that do not need the 20-minute image build.
  lint:
    name: lint (shell + js + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n entrypoint.sh
          bash -n verify.sh
          echo 'entrypoint.sh and verify.sh parse'

      - name: Node syntax (ESM entry scripts)
        run: |
          set -euo pipefail
          for f in patch-client-settings.mjs doctor.mjs; do
            node --check "$f"
            echo "$f parses"
          done

      - name: Every bundled plugin is a loadable bundle
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            manifest="${dir}package.json"
            name="$(node -p "require('./${manifest}').name ?? ''")"
            entry="$(node -p "const p=require('./${manifest}'); const e=p.exports ?? p.main ?? ''; typeof e === 'string' ? e : (e['.'] ?? '')")"
            [ -n "$name" ] || { echo "::error::${dir} declares no name"; exit 1; }
            [ -n "$entry" ] && [ -e "${dir}${entry}" ] || { echo "::error::${dir}: entry ${entry:-<none>} missing"; exit 1; }
            echo "ok: ${name} (${entry})"
          done

      - name: compose.yaml is valid and interpolates
        env:
          # compose.yaml requires this (`${DSH_SITE_ADDRESS:?...}`); no .env exists in CI.
          DSH_SITE_ADDRESS: dsh.example.com
          DSH_TRUSTED_HOSTS: dsh.example.com
        run: docker compose config -q && echo 'compose.yaml parses'

  build:
    name: build image
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # The full image (Office + Chrome + Python + the ~250-package npm tree)
        # plus BuildKit's working set can exhaust the ~14 GB these runners ship.
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Resolve DSH version, image name and build settings
        id: cfg
        env:
          DISPATCH_VERSION: ${{ inputs.dsh_version }}
          DISPATCH_LAYERS: ${{ inputs.layers }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms }}
          DISPATCH_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail

          version="${DISPATCH_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(grep -m1 '^DSH_VERSION=' .env.example | cut -d= -f2- | tr -d '\r' || true)"
          fi
          if [ -z "$version" ]; then
            echo '::error::no DSH_VERSION in .env.example and none supplied'
            exit 1
          fi

          # GHCR rejects uppercase; GITHUB_REPOSITORY is case-preserving.
          # Double quotes on purpose: ${VAR,,} inside single quotes would stay literal.
          image="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"

          platforms="${DISPATCH_PLATFORMS:-linux/amd64}"
          # A pull request always builds one platform and never pushes.
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            platforms='linux/amd64'
          fi

          push='false'
          if [ '${{ github.event_name }}' = 'push' ]; then push='true'; fi
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ "${DISPATCH_PUSH:-true}" = 'true' ]; then push='true'; fi

          # `load` puts a single-platform build into the local docker daemon, which
          # is what the smoke step below needs. It cannot be combined with push or
          # with more than one platform.
          load='false'
          if [ "$push" = 'false' ] && [ "$platforms" = 'linux/amd64' ]; then load='true'; fi

          if [ "${DISPATCH_LAYERS:-full}" = 'slim' ]; then
            office='0'; chrome='0'; python='0'; cuda='0'
            cuda_version='13.0'
          else
            office='${{ vars.INSTALL_OFFICE || '1' }}'
            chrome='${{ vars.INSTALL_CHROME || '1' }}'
            python='${{ vars.INSTALL_PYTHON_DOCS || '1' }}'
            # CUDA stays off unless the repository sets INSTALL_CUDA=1 as an
            # Actions variable: it is the one layer that is off by default, and a
            # CI image with a compiler in it is not what most pulls want.
            cuda='${{ vars.INSTALL_CUDA || '0' }}'
            cuda_version='${{ vars.CUDA_VERSION || '13.0' }}'
          fi

          # The Dockerfile boots the GUI for this long to prove the image works.
          # QEMU-emulated arm64 needs more headroom than native amd64.
          smoke='60'
          case "$platforms" in
            *arm64*) smoke='240' ;;
          esac

          # Is this the newest version this repository has ever released?
          # `latest` follows the answer, so a rebuild of an older version (a
          # hotfix, a revert) cannot drag the tag backwards.
          #
          # ls-remote lists tags without fetching any objects. The comparison is
          # `sort -V` (GNU version sort), which orders 0.2.2-rc.10 after
          # 0.2.2-rc.5 — a plain lexicographic sort would get that backwards.
          # It ranks a final "0.2.2" and a "0.2.2-rc.5" by its own rules, which
          # is close enough here: this repository only ever tags dsh versions as
          # dsh publishes them.
          newest='true'
          tags="$(git ls-remote --tags --refs origin 'v*' 2>/dev/null | sed 's#.*refs/tags/v##' | tr -d '\r' || true)"
          if [ -n "${tags}" ]; then
            highest="$(printf '%s\n%s\n' "${tags}" "${version}" | grep -v '^$' | sort -V | tail -n1)"
            if [ "${highest}" != "${version}" ]; then newest='false'; fi
          fi
          echo "newest=${newest} (highest tag: $(printf '%s\n' "${tags}" | grep -v '^$' | sort -V | tail -n1 || echo none), building ${version})"

          {
            echo "version=${version}"
            echo "image=${image}"
            echo "platforms=${platforms}"
            echo "push=${push}"
            echo "load=${load}"
            echo "office=${office}"
            echo "chrome=${chrome}"
            echo "python=${python}"
            echo "cuda=${cuda}"
            echo "cuda_version=${cuda_version}"
            echo "smoke=${smoke}"
            echo "newest=${newest}"
          } >> "$GITHUB_OUTPUT"

          echo "dsh ${version} -> ${image} [${platforms}] push=${push} layers=office:${office} chrome:${chrome} python:${python} smoke=${smoke}s"

      - name: Set up QEMU
        # Needed only for arm64, but the action is a no-op cost when the build is
        # amd64-only.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cfg.outputs.image }}
          labels: |
            org.opencontainers.image.title=dsh-docker
            org.opencontainers.image.description=DeepSeek Harness (dsh) Web GUI in one container: image + entrypoint + Caddy TLS front
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.cfg.outputs.version }}
          tags: |
            type=raw,value=${{ steps.cfg.outputs.version }}
            type=raw,value=latest,enable=${{ steps.cfg.outputs.push == 'true' && steps.cfg.outputs.newest == 'true' }}
            type=raw,value=${{ steps.cfg.outputs.version }}-slim,enable=${{ steps.cfg.outputs.office == '0' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: ${{ steps.cfg.outputs.push }}
          load: ${{ steps.cfg.outputs.load }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.cfg.outputs.version }}
            INSTALL_OFFICE=${{ steps.cfg.outputs.office }}
            INSTALL_CHROME=${{ steps.cfg.outputs.chrome }}
            INSTALL_PYTHON_DOCS=${{ steps.cfg.outputs.python }}
            INSTALL_CUDA=${{ steps.cfg.outputs.cuda }}
            CUDA_VERSION=${{ steps.cfg.outputs.cuda_version }}
            BOOT_SMOKE_SECONDS=${{ steps.cfg.outputs.smoke }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations are a registry feature; a `load`-only build cannot carry
          # them (buildx refuses provenance together with docker load).
          provenance: ${{ steps.cfg.outputs.push == 'true' }}
          sbom: false

      # The Dockerfile already boots the GUI during the build; this adds the two
      # facts a build log cannot show: the CLI version baked into the image, and
      # the size a user will actually pull.
      - name: Smoke the built image (amd64, not pushed)
        if: steps.cfg.outputs.load == 'true'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          echo "--- dsh --version in the image ---"
          docker run --rm --entrypoint dsh "$IMAGE" --version
          echo "--- entrypoint parses in the image ---"
          docker run --rm --entrypoint bash "$IMAGE" -n /usr/local/bin/dsh-entrypoint
          echo "--- image size ---"
          docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: Summary
        run: |
          {
            echo "### dsh-docker build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| dsh version | \`${{ steps.cfg.outputs.version }}\` |"
            echo "| image | \`${{ steps.cfg.outputs.image }}\` |"
            echo "| platforms | \`${{ steps.cfg.outputs.platforms }}\` |"
            echo "| pushed | \`${{ steps.cfg.outputs.push }}\` |"
            echo "| layers | office=\`${{ steps.cfg.outputs.office }}\` chrome=\`${{ steps.cfg.outputs.chrome }}\` python=\`${{ steps.cfg.outputs.python }}\` cuda=\`${{ steps.cfg.outputs.cuda }}\` (\`${{ steps.cfg.outputs.cuda_version }}\`) |"
            echo "| newest release | \`${{ steps.cfg.outputs.newest }}\` (controls whether \`latest\` moves) |"
            echo
            echo "Tags:"
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Cut the release. Runs only for a push to main, i.e. exactly once per merged
  # version bump, and only after the image built and pushed successfully — a
  # release that exists but has no image behind its tag would be a lie.
  #
  # Idempotent by design: if v<version> already exists, this does nothing. That
  # is what makes it safe to re-run, and it is also why publishing the same
  # version twice cannot fork the tag.
  release:
    name: tag + GitHub release
    needs: [lint, build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags must be present to answer "does v<version> exist already?".
          fetch-depth: 0

      - name: Read the pinned dsh version
        id: ver
        run: |
          set -euo pipefail
          version="$(grep -m1 '^DSH_VERSION=' .env.example | cut -d= -f2- | tr -d '\r')"
          if [ -z "${version}" ]; then
            echo '::error::no DSH_VERSION in .env.example'
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists — this version was released before, nothing to do"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "dsh ${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

          # GHCR rejects uppercase; GITHUB_REPOSITORY is case-preserving.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          notes="$(mktemp)"
          {
            echo "Image for **dsh ${VERSION}**, built from commit \`${GITHUB_SHA:0:7}\`."
            echo
            echo '```'
            echo "docker pull ${image}:${VERSION}"
            echo '```'
            echo
            echo '### Tags in this release'
            echo
            echo '| tag | meaning |'
            echo '|---|---|'
            echo "| \`${VERSION}\` | this dsh version, pinned |"
            echo "| \`${VERSION}-slim\` | same version without Office / Chrome / Python, when built that way |"
            echo '| `latest` | the newest version only — it does not move backwards |'
            echo
            echo '### What is inside'
            echo
            echo "- dsh \`${VERSION}\` on Node 24 (upstream requires >= 24.9.0 since 0.2.2)"
            echo '- `python:3.11-slim-bookworm` base (glibc, which node-pty needs)'
            echo '- Caddy TLS front, Landlock sandbox, three bundled plugins'
            echo '- build-time gates: Node floor, install-tree assertion, settings-patch check, `--dump-config`, 60s boot smoke'
            echo
            echo 'README covers docker compose; `docs/openshift-deployment.md` covers OpenShift.'
          } > "${notes}"

          # dsh publishes release candidates, so most tags here are pre-releases.
          # Saying so keeps GitHub from labelling an rc as the stable "Latest".
          prerelease=''
          case "${VERSION}" in
            *-*) prerelease='--prerelease' ;;
          esac

          gh release create "${TAG}" \
            --title "dsh ${VERSION}" \
            --notes-file "${notes}" \
            ${prerelease}

      - name: Summary
        run: |
          {
            echo "### release"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.ver.outputs.tag }}\` |"
            echo "| dsh version | \`${{ steps.ver.outputs.version }}\` |"
            echo "| image | \`ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

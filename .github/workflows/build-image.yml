# Build the dsh-docker image on GitHub Actions and publish it to GHCR.
#
#   push to main / v* tag   build + push   ghcr.io/<owner>/<repo>:<dsh version>
#   pull request            build only (no push, no registry login needed)
#   manual (workflow_dispatch)  build + optional push, optional arm64, full or slim
#
# The version comes from `.env.example`'s DSH_VERSION unless the manual trigger
# overrides it, so the workflow never invents a version that the repository does
# not actually pin. The Dockerfile's own build-time gates (Node floor, install-tree
# assertion, settings patch --check, --dump-config, 60s boot smoke from an empty
# home) run inside the build, so a green build already means "this image boots".
name: build-image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - entrypoint.sh
      - doctor.mjs
      - patch-client-settings.mjs
      - plugins/**
      - skills/**
      - unauth/**
      - Caddyfile
      - compose.yaml
      - .env.example
      - .dockerignore
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - doctor.mjs
      - patch-client-settings.mjs
      - plugins/**
      - skills/**
      - unauth/**
      - Caddyfile
      - compose.yaml
      - .env.example
      - .dockerignore
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '@deepseek-ai/dsh version to install (empty = read .env.example)'
        required: false
        default: ''
      layers:
        description: 'Optional layers: full (office + chrome + python) or slim'
        type: choice
        options: [full, slim]
        default: full
      platforms:
        description: 'arm64 runs under QEMU and takes much longer'
        type: choice
        options: ['linux/amd64', 'linux/amd64,linux/arm64']
        default: linux/amd64
      push:
        description: 'Push the result to GHCR'
        type: boolean
        default: true

# One build per ref: a newer push supersedes an in-flight one.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Cheap, deterministic checks that do not need the 20-minute image build.
  lint:
    name: lint (shell + js + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n entrypoint.sh
          bash -n verify.sh
          echo 'entrypoint.sh and verify.sh parse'

      - name: Node syntax (ESM entry scripts)
        run: |
          set -euo pipefail
          for f in patch-client-settings.mjs doctor.mjs; do
            node --check "$f"
            echo "$f parses"
          done

      - name: Every bundled plugin is a loadable bundle
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            manifest="${dir}package.json"
            name="$(node -p "require('./${manifest}').name ?? ''")"
            entry="$(node -p "const p=require('./${manifest}'); const e=p.exports ?? p.main ?? ''; typeof e === 'string' ? e : (e['.'] ?? '')")"
            [ -n "$name" ] || { echo "::error::${dir} declares no name"; exit 1; }
            [ -n "$entry" ] && [ -e "${dir}${entry}" ] || { echo "::error::${dir}: entry ${entry:-<none>} missing"; exit 1; }
            echo "ok: ${name} (${entry})"
          done

      - name: compose.yaml is valid and interpolates
        env:
          # compose.yaml requires this (`${DSH_SITE_ADDRESS:?...}`); no .env exists in CI.
          DSH_SITE_ADDRESS: dsh.example.com
          DSH_TRUSTED_HOSTS: dsh.example.com
        run: docker compose config -q && echo 'compose.yaml parses'

  build:
    name: build image
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The full image (Office + Chrome + Python + the ~250-package npm tree)
        # plus BuildKit's working set can exhaust the ~14 GB these runners ship.
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Resolve DSH version, image name and build settings
        id: cfg
        env:
          DISPATCH_VERSION: ${{ inputs.dsh_version }}
          DISPATCH_LAYERS: ${{ inputs.layers }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms }}
          DISPATCH_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail

          version="${DISPATCH_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(grep -m1 '^DSH_VERSION=' .env.example | cut -d= -f2- | tr -d '\r' || true)"
          fi
          if [ -z "$version" ]; then
            echo '::error::no DSH_VERSION in .env.example and none supplied'
            exit 1
          fi

          # GHCR rejects uppercase; GITHUB_REPOSITORY is case-preserving.
          # Double quotes on purpose: ${VAR,,} inside single quotes would stay literal.
          image="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"

          platforms="${DISPATCH_PLATFORMS:-linux/amd64}"
          # A pull request always builds one platform and never pushes.
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            platforms='linux/amd64'
          fi

          push='false'
          if [ '${{ github.event_name }}' = 'push' ]; then push='true'; fi
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ "${DISPATCH_PUSH:-true}" = 'true' ]; then push='true'; fi

          # `load` puts a single-platform build into the local docker daemon, which
          # is what the smoke step below needs. It cannot be combined with push or
          # with more than one platform.
          load='false'
          if [ "$push" = 'false' ] && [ "$platforms" = 'linux/amd64' ]; then load='true'; fi

          if [ "${DISPATCH_LAYERS:-full}" = 'slim' ]; then
            office='0'; chrome='0'; python='0'
          else
            office='${{ vars.INSTALL_OFFICE || '1' }}'
            chrome='${{ vars.INSTALL_CHROME || '1' }}'
            python='${{ vars.INSTALL_PYTHON_DOCS || '1' }}'
          fi

          # The Dockerfile boots the GUI for this long to prove the image works.
          # QEMU-emulated arm64 needs more headroom than native amd64.
          smoke='60'
          case "$platforms" in
            *arm64*) smoke='240' ;;
          esac

          {
            echo "version=${version}"
            echo "image=${image}"
            echo "platforms=${platforms}"
            echo "push=${push}"
            echo "load=${load}"
            echo "office=${office}"
            echo "chrome=${chrome}"
            echo "python=${python}"
            echo "smoke=${smoke}"
          } >> "$GITHUB_OUTPUT"

          echo "dsh ${version} -> ${image} [${platforms}] push=${push} layers=office:${office} chrome:${chrome} python:${python} smoke=${smoke}s"

      - name: Set up QEMU
        # Needed only for arm64, but the action is a no-op cost when the build is
        # amd64-only.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cfg.outputs.image }}
          labels: |
            org.opencontainers.image.title=dsh-docker
            org.opencontainers.image.description=DeepSeek Harness (dsh) Web GUI in one container: image + entrypoint + Caddy TLS front
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.cfg.outputs.version }}
          tags: |
            type=raw,value=${{ steps.cfg.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.cfg.outputs.version }}-slim,enable=${{ steps.cfg.outputs.office == '0' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: ${{ steps.cfg.outputs.push }}
          load: ${{ steps.cfg.outputs.load }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.cfg.outputs.version }}
            INSTALL_OFFICE=${{ steps.cfg.outputs.office }}
            INSTALL_CHROME=${{ steps.cfg.outputs.chrome }}
            INSTALL_PYTHON_DOCS=${{ steps.cfg.outputs.python }}
            BOOT_SMOKE_SECONDS=${{ steps.cfg.outputs.smoke }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations are a registry feature; a `load`-only build cannot carry
          # them (buildx refuses provenance together with docker load).
          provenance: ${{ steps.cfg.outputs.push == 'true' }}
          sbom: false

      # The Dockerfile already boots the GUI during the build; this adds the two
      # facts a build log cannot show: the CLI version baked into the image, and
      # the size a user will actually pull.
      - name: Smoke the built image (amd64, not pushed)
        if: steps.cfg.outputs.load == 'true'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          echo "--- dsh --version in the image ---"
          docker run --rm --entrypoint dsh "$IMAGE" --version
          echo "--- entrypoint parses in the image ---"
          docker run --rm --entrypoint bash "$IMAGE" -n /usr/local/bin/dsh-entrypoint
          echo "--- image size ---"
          docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: Summary
        run: |
          {
            echo "### dsh-docker build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| dsh version | \`${{ steps.cfg.outputs.version }}\` |"
            echo "| image | \`${{ steps.cfg.outputs.image }}\` |"
            echo "| platforms | \`${{ steps.cfg.outputs.platforms }}\` |"
            echo "| pushed | \`${{ steps.cfg.outputs.push }}\` |"
            echo "| layers | office=\`${{ steps.cfg.outputs.office }}\` chrome=\`${{ steps.cfg.outputs.chrome }}\` python=\`${{ steps.cfg.outputs.python }}\` |"
            echo
            echo "Tags:"
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

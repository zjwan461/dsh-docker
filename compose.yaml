name: dsh

# DeepSeek Harness Web GUI behind one TLS reverse proxy.
#
#   browser ──HTTPS──> caddy ──HTTP (compose network)──> dsh:3080
#
# The dsh service publishes no port. Caddy is the only network entry point,
# which is what lets the container bind 0.0.0.0 internally while the host still
# exposes nothing but the TLS port.

x-dsh-image: &dsh-image
  build:
    context: .
    args:
      DSH_VERSION: ${DSH_VERSION:-0.1.5-rc.3}
      DSH_UID: ${DSH_UID:-1000}
      DSH_GID: ${DSH_GID:-1000}
      # Optional image layers. Both default to 1 (installed); set them to 0 in
      # .env to build a leaner image. See README 「镜像里预装了什么」 for the cost.
      INSTALL_OFFICE: ${INSTALL_OFFICE:-1}
      INSTALL_PYTHON_DOCS: ${INSTALL_PYTHON_DOCS:-1}
  image: dsh:${DSH_VERSION:-0.1.5-rc.3}

services:
  dsh:
    <<: *dsh-image
    restart: unless-stopped
    # Match this to the owner of DSH_WORKSPACES on the host, otherwise the
    # agent cannot write into its workspace. On a typical single-user server
    # the default already matches.
    user: "${DSH_UID:-1000}:${DSH_GID:-1000}"
    working_dir: /workspaces
    # Lets settings.yaml reach a LiteLLM running on the Docker HOST as
    # http://host.docker.internal:4000/v1 (inside a container, `localhost` is
    # the container itself). Requires Docker 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # DSH_* names are bootstrap-only: they must arrive as real environment
      # variables, never through a .env file inside the container.
      DSH_HOME: /data/dsh
      DSH_BIND_HOST: "0.0.0.0"
      DSH_BIND_PORT: ${DSH_BIND_PORT:-3080}
      # Inherited environment outranks the managed credential file and any
      # workspace .env, so a cloned repository cannot redirect this key.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Credential for the internal vLLM-behind-LiteLLM route declared in
      # settings.yaml (llm-pi-ai.providers.vllm-local.apiKeyEnv names it).
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      # read-only | workspace-write | danger-full-access
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-workspace-write}
      # Empty value => no --trusted-host flag => browser accesses get 403.
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      DSH_TELEMETRY_DISABLED: ${DSH_TELEMETRY_DISABLED:-1}
      # Bundled plugins ship at /opt/dsh-plugins (every directory under plugins/ is
      # copied there at build time) and are enabled at container start. Point this at
      # a mounted host directory to add plugins without rebuilding the image.
      DSH_PLUGIN_ROOT: ${DSH_PLUGIN_ROOT:-/opt/dsh-plugins}

      TZ: ${TZ:-UTC}
    # The settings UI works over the domain because this image ships a deployment
    # patch (patch-client-settings.mjs) that makes `$host.isLoopback` true in the
    # browser bundle, so the pages edit the HOST document instead of a session-local
    # one. If that patch is ever reverted, a loopback origin is the only remaining
    # route to the settings pages, and this optional binding provides it:
    #     ssh -L 3080:127.0.0.1:3080 <user>@<server>
    #     open http://127.0.0.1:3080/?token=<from docker compose logs dsh>
    # ports:
    #   - "127.0.0.1:3080:3080"
    volumes:
      # $DSH_HOME is a DIRECTORY bind mount, not a named volume, so that the host
      # and the web UI write the same real file:
      #
      #   * the settings provider persists with an atomic write — a temp file plus
      #     rename() over the target (dsh-config-editor -> writeFileAtomic, under
      #     withFileLock). A SINGLE-FILE bind mount cannot support that: rename()
      #     onto a mount point fails with EBUSY, and with `:ro` it fails with
      #     EROFS. Binding the directory leaves rename() an ordinary in-directory
      #     operation, so a save from the Models page lands on the host file while
      #     a host edit is hot-reloaded through the chokidar watcher. Both
      #     directions work and the two copies cannot diverge.
      #
      #   * The host directory must exist before `up` (Docker creates a missing
      #     bind source as a root-owned directory) and must be writable by
      #     DSH_UID:DSH_GID. entrypoint.sh checks both and prints the fix.
      #
      #   * Hot reload relies on inotify reaching the container. Guaranteed on a
      #     Linux server host; on Windows/macOS Docker Desktop the mount may not
      #     propagate file events — fall back to `docker compose restart dsh`.
      #
      #   * data/dsh/settings.yaml is both the seed and the file the UI edits. The
      #     named volume this replaced also held sessions/ and .credentials.yaml,
      #     so migrate it once — but KEEP the repository's settings.yaml, which is
      #     the configuration that is live today. A stale copy inside the volume
      #     (from the era when the file lived there) would otherwise silently
      #     replace it:
      #       docker compose down
      #       docker run --rm -v dsh_dsh-home:/from -v "$PWD/data/dsh":/to alpine \
      #         sh -c 'cp -a /from/. /to/; [ -f /to/settings.yaml ] && mv /to/settings.yaml /to/settings.yaml.from-volume'
      #       git checkout -- data/dsh/settings.yaml
      #       sudo chown -R "$(id -u):$(id -g)" ./data/dsh
      #     The old volume can then be dropped: docker volume rm dsh_dsh-home
      - ./data/dsh:/data/dsh
      - ${DSH_WORKSPACES:-./workspaces}:/workspaces
      # OPTIONAL: built-in skills without a rebuild.
      #
      # The image already bakes skills/ into /opt/dsh-skills and registers that
      # path as the bundled skill root (DSH_BUNDLED_SKILL_DIR), so this line is
      # only needed while you are AUTHORING a skill: it lets the host directory
      # shadow the baked copy, and the skill watcher hot-reloads the change.
      # :ro because built-ins are deployment assets, not agent scratch space —
      # /opt/dsh-skills is deliberately outside the workspace, which is why the
      # bundled root is the trusted one.
      #
      # Uncomment, `docker compose up -d`, and edit skills/<name>/SKILL.md:
      # - ./skills:/opt/dsh-skills:ro
    stop_grace_period: 15s
    # GET / without a valid browser cookie answers 401, which is the healthy
    # state for a server that has never been logged into.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$${DSH_BIND_PORT:-3080}/ | grep -qE '^(200|401)$'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [dsh]

  # OPTIONAL: a small FastAPI admin panel that reads the dsh container's startup
  # log and shows the current login token, plus a ready-to-click login URL.
  #
  # It sits behind the `admin` profile, so `docker compose up -d` behaves exactly
  # as before. Enable it explicitly:
  #
  #     docker compose --profile admin up -d --build admin
  #     docker compose --profile admin logs -f admin
  #
  # Two things come with it, and neither is optional:
  #
  #  1. It mounts /var/run/docker.sock. Reading another container's log has no
  #     narrower route, but that mount is root-equivalent access to the host —
  #     the panel can do anything the daemon can. Treat this container as trusted
  #     infrastructure and never publish it beyond loopback.
  #  2. ADMIN_PASSWORD is mandatory. Compose refuses to start without it (`:?`
  #     below), and app/main.py independently refuses to boot when bound to
  #     anything but 127.0.0.1 without one — because the panel prints a token
  #     that drives an agent inside the dsh container.
  #
  # Published on loopback only; reach it over an SSH tunnel:
  #     ssh -L 8642:127.0.0.1:8642 <user>@<server>   ->   http://127.0.0.1:8642/
  #
  # It needs no TLS of its own over that tunnel, and Caddy is NOT in this path:
  # the dsh entry point stays the single public port. To put it behind Caddy
  # instead, add a site block there and read admin/README.md 「安全」 first.
  admin:
    build:
      context: ./admin
      args:
        # Group of /var/run/docker.sock on the host:
        #     stat -c '%g' /var/run/docker.sock
        ADMIN_DOCKER_GID: ${ADMIN_DOCKER_GID:-999}
    image: dsh-admin:${ADMIN_VERSION:-0.1.0}
    profiles: ["admin"]
    restart: unless-stopped
    # required: false so that stopping dsh does not block the panel — it is most
    # useful exactly when dsh is down or restarting, because a fresh start is
    # when the new token appears in the log.
    depends_on:
      dsh:
        condition: service_started
        required: false
    environment:
      ADMIN_BIND_HOST: "0.0.0.0"
      ADMIN_BIND_PORT: "8642"
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env — the admin panel shows a live login token}
      # Empty => resolve the dsh container by compose labels (project/service).
      ADMIN_CONTAINER: ${ADMIN_CONTAINER:-}
      ADMIN_COMPOSE_PROJECT: dsh
      ADMIN_COMPOSE_SERVICE: dsh
      # Only used to build the browser-facing link: https://<authority>/?token=…
      ADMIN_SITE_ADDRESS: ${DSH_SITE_ADDRESS:-}
      ADMIN_PUBLIC_PORT: ${DSH_PUBLIC_PORT:-443}
      ADMIN_REFRESH_SECONDS: ${ADMIN_REFRESH_SECONDS:-5}
      TZ: ${TZ:-UTC}
    ports:
      # Loopback on the HOST side, deliberately. Do not widen this without TLS
      # and a second factor in front (admin/README.md 「安全」).
      - "127.0.0.1:${ADMIN_PORT:-8642}:8642"
    volumes:
      # The one route to another container's log. See the warning above.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [dsh]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # `required: false` (Compose v2.20+) decouples this proxy from the backend,
    # so `up -d caddy` alone is possible and an absent backend simply leaves the
    # site answering 502 while Caddy still starts.
    # `condition: service_started` (not service_healthy) is deliberate: waiting
    # for a healthcheck would delay the proxy by the whole start_period, and a
    # 502 during the first minute after `up` is expected.
    depends_on:
      dsh:
        condition: service_started
        required: false
    environment:
      DSH_SITE_ADDRESS: ${DSH_SITE_ADDRESS:?set DSH_SITE_ADDRESS in .env (authority only, no scheme), e.g. dsh.example.com}
      DSH_UPSTREAM: dsh:${DSH_BIND_PORT:-3080}
      # Who may use the plaintext :80 listener, once you publish it. Addresses outside
      # this list get 403, and the default is loopback only — so a published :80
      # answers nobody until you name your clients.
      DSH_HTTP_ALLOWED_RANGES: "${DSH_HTTP_ALLOWED_RANGES:-127.0.0.1/32 ::1/128}"
      # Docker injects HTTP_PROXY/HTTPS_PROXY into containers from the client or
      # daemon proxy config, and a build can bake them into the image as ENV.
      # Caddy's reverse_proxy honors those variables, so the upstream request
      # would be sent to the corporate proxy instead of over the compose
      # network; the proxy cannot reach `dsh` and answers 504, which Caddy
      # relays to the browser. That looks exactly like a broken container
      # network but is not one. Caddy needs no outbound access at all here
      # (`tls internal` performs no ACME), so clear the variables and bypass any
      # that survive the injection.
      # NOTE: if this deployment ever switches to a public domain with ACME,
      # drop NO_PROXY/no_proxy="*" here — Caddy then needs outbound access to
      # the CA, and "*" would deny it a route out.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    # ONE published port, serving the GUI site. Check before the first `up`:
    #   sudo ss -ltnp 'sport = :443'
    # If another web server already owns :443, either front this stack with that
    # server or move the site to a spare port (see .env.example).
    # ---------------------------------------------------------------------
    # OPTIONAL, and dangerous: publishing :80 serves the GUI over plaintext.
    #
    # DSH's session cookie is deliberately NOT marked `Secure` (it assumes a
    # loopback origin), so over plaintext HTTP that cookie travels in the clear on
    # every request — and it is the ONLY authentication in front of an agent that
    # can run commands inside this container. On a shared network that amounts to
    # handing remote code execution to whoever is on the path. See the matching
    # warning in the Caddyfile.
    #
    # Running BOTH listeners at once (HTTPS on 443 as configured, plaintext on 80):
    #   1. set DSH_HTTP_ALLOWED_RANGES to the addresses that may use it — the site
    #      itself is already DEFINED in Caddyfile and follows DSH_SITE_ADDRESS;
    #   2. uncomment the :80 mapping below (the container side must stay 80);
    #   3. list EVERY authority you browse in DSH_TRUSTED_HOSTS, comma-separated:
    #        DSH_TRUSTED_HOSTS=dsh.internal,192.168.1.20
    #
    #
    # An allowlist limits who may CONNECT, not who may SNIFF, so this is only ever
    # appropriate on a network you fully control. On a public address use Option C
    # in the Caddyfile (a real domain with ACME) or an SSH tunnel instead: the
    # cookie is not marked Secure, and it drives an agent that runs commands.
    # Caddy permits this because the global block sets `auto_https disable_redirects`:
    # it therefore never claims :80 for its own HTTP->HTTPS redirect listener, which
    # leaves that port free for a site of our own. Two consequences worth knowing:
    # the origins do NOT share cookies, so you log in once per origin, but they DO
    # share the host settings document, so a change through one shows in the other.
    # ports:
    # The container side MUST stay 80: the plaintext site in Caddyfile is written as
    # http://{$DSH_SITE_ADDRESS} with no port, so Caddy listens on 80 inside. Only
    # the HOST side is yours to choose — pick any free port and browse with it.
    #   - "${DSH_PUBLIC_BIND:-0.0.0.0}:80:80"     # http://<site>/
    #   - "${DSH_PUBLIC_BIND:-0.0.0.0}:81:80"     # http://<site>:81/
    # Do NOT put that host port into DSH_SITE_ADDRESS: the variable also builds the
    # HTTPS site, so a port there would move the TLS listener and desynchronise the
    # plaintext one from this mapping. DSH_TRUSTED_HOSTS stays port-less too, which
    # matches the browser's authority on every port.
    # ---------------------------------------------------------------------
    ports:
      - "${DSH_PUBLIC_BIND:-0.0.0.0}:${DSH_PUBLIC_PORT:-443}:${DSH_PUBLIC_PORT:-443}"
      - "${DSH_PUBLIC_BIND:-0.0.0.0}:80:80" 
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The page Caddy serves for an unauthenticated first visit (Caddyfile's
      # @firstVisit route). A static file, so dsh and its plugins stay untouched.
      - ./unauth:/srv/unauth:ro
      # Only read when Caddyfile Option B (a certificate from your internal CA)
      # is enabled; harmless while the directory is empty.
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [dsh]

networks:
  dsh:
    driver: bridge

volumes:
  # Caddy's certificates and ACME account. The GUI's own state (profiles/,
  # sessions/, storages/, .credentials.yaml, settings.yaml) is deliberately NOT a
  # named volume: it is the ./data/dsh directory bind mount above, so that the
  # host and the web UI edit the same files and either side can be inspected or
  # backed up with ordinary file tools.
  caddy-data:
  caddy-config:

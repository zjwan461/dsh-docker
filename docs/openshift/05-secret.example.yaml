# EXAMPLE ONLY — do not apply this file as-is, and never commit a real key.
#
# Create the Secret imperatively instead (keeps the key out of git and out of
# shell history if you use --from-file / a prompt):
#
#   oc create secret generic dsh-secrets -n dsh \
#     --from-literal=DEEPSEEK_API_KEY="$(read -rs -p 'DEEPSEEK_API_KEY: ' k; echo "$k")" \
#     --from-literal=LITELLM_API_KEY='<your-litellm-key>'
#
#   # later:
#   oc set env deployment/dsh --from=secret/dsh-secrets   # or just restart
#
# Why a Secret and not a ConfigMap or a .env file: dsh resolves credentials in
# this order — inherited environment > $DSH_HOME/.credentials.yaml > cwd .env >
# $DSH_HOME/.env — so an environment variable wins over anything a cloned
# repository could drop into the workspace.
#
# Both keys are OPTIONAL in the Deployment: the pod starts without them (you can
# enter credentials in the Models page, which writes them to the PVC), and a
# missing key never blocks the rollout.
#
# If you prefer the declarative file anyway, this is the shape:
apiVersion: v1
kind: Secret
metadata:
  name: dsh-secrets
  labels:
    app.kubernetes.io/name: dsh
type: Opaque
stringData:
  # Credential for the public api.deepseek.com (also used by web_search).
  DEEPSEEK_API_KEY: ""
  # Credential for the internal vLLM-behind-LiteLLM route in settings.yaml.
  LITELLM_API_KEY: ""
# The container needs no API server access at all: it serves HTTP and runs
# shells inside itself. A dedicated ServiceAccount keeps it out of `default`
# and lets an SCC be bound to exactly this workload if the cluster ever needs it.
#
# `automountServiceAccountToken: false` removes the token mount — the pod has no
# reason to hold a credential that can talk to the API server.
#
# Pulling from the in-cluster registry still works with this set: the kubelet
# obtains its own token for an image pull, it does not read the one mounted into
# the pod. (If you ever see ImagePullBackOff with a 401 from
# image-registry.openshift-image-registry.svc, that assumption is what to
# revisit — see the manual's troubleshooting table.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsh
  labels:
    app.kubernetes.io/name: dsh
automountServiceAccountToken: false